# Author: Boxuan Shan, with support from Claude (Anthropic)
# Run every suite from data/:  pytest        (live-API tests: pytest -m integration)
[pytest]
testpaths =
    common/tests
    nces_crawl/tests
    wiki_crawl/tests
    data_publish/tests
# importlib mode: the four tests/ packages share a name and would collide.
addopts = -m "not integration" --import-mode=importlib
markers =
    integration: live-network tests (run explicitly with -m integration)
