# Tests for the data pipeline and a production build of the website.
# Checkout skips Git LFS: no test reads the NCES master CSVs, and LFS downloads
# count against the repository's monthly bandwidth.
name: CI

on:
  push:
  pull_request:

jobs:
  data-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q          # live-API tests are deselected by pytest.ini

  website-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/web/package-lock.json
      - run: npm ci
      - run: npm run build                # no Supabase env: the app falls back to localStorage
