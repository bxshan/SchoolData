<script>
// The only placeholders that map to user-fillable infobox fields.
// (Wikitext templates like {{Reflist}} / {{Infobox school}} are intentionally excluded.)
const FIELDS = [
  { key: "YEAR_ESTABLISHED",     label: "Established (founding year)", ph: "e.g. 1958" },
  { key: "PRINCIPAL",            label: "Principal",                  ph: "Full name" },
  { key: "MASCOT",               label: "Mascot",                     ph: "e.g. Pioneer" },
  { key: "SCHOOL_COLORS",        label: "School colors",              ph: "e.g. Navy & Gold" },
  { key: "ATHLETICS_CONFERENCE", label: "Athletics conference",       ph: "League / section" },
  { key: "FEEDER_SCHOOLS",       label: "Feeder schools",             ph: "Comma-separated" },
  { key: "OFFICIAL_URL",         label: "Official website URL",       ph: "https://…" },
  { key: "COORD",                label: "Coordinates (lat, lon)",     ph: "37.31, -122.01" },
  { key: "NCES_REPORTING_YEAR",  label: "NCES reporting year",        ph: "e.g. 2023–24" },
];

const RAW = document.getElementById("source").textContent;
const values = {};
let wikitextFolded = false; // fold state preserved across re-renders
const fieldsEl = document.getElementById("fields");
const previewEl = document.getElementById("preview");
const statusEl = document.getElementById("status");

marked.setOptions({ gfm: true, breaks: false });

FIELDS.forEach(f => {
  values[f.key] = "";
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.innerHTML =
    `<label>${f.label} <span class="key">{{${f.key}}}</span></label>` +
    `<input data-key="${f.key}" placeholder="${f.ph}">`;
  fieldsEl.appendChild(wrap);
});

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Substitute filled values; wrap any still-empty placeholder in a red marker.
function buildSource() {
  let out = RAW;
  FIELDS.forEach(f => {
    const re = new RegExp("\\{\\{" + f.key + "\\}\\}", "g");
    out = out.replace(re, values[f.key].trim());
  });
  return out;
}

function render() {
  let src = RAW;
  FIELDS.forEach(f => {
    const v = values[f.key].trim();
    const re = new RegExp("\\{\\{" + f.key + "\\}\\}", "g");
    // Filled -> the value; empty -> an HTML span the markdown renderer passes through.
    src = src.replace(re, v ? escapeHtml(v)
      : `<span class="unfilled">{{${f.key}}}</span>`);
  });
  previewEl.innerHTML = marked.parse(src);
  decorateWikitext();
}

// Add a clickable fold header above the rendered ```wikitext``` block.
function decorateWikitext() {
  const code = previewEl.querySelector("pre code.language-wikitext");
  if (!code) return;
  const pre = code.parentElement;
  const header = document.createElement("div");
  header.className = "fold-header" + (wikitextFolded ? " folded" : "");
  header.innerHTML = '<span class="arrow">▼</span> wikitext (click to ' +
    (wikitextFolded ? "expand" : "fold") + ")";
  pre.parentElement.insertBefore(header, pre);
  pre.style.display = wikitextFolded ? "none" : "";
  header.addEventListener("click", () => {
    wikitextFolded = !wikitextFolded;
    pre.style.display = wikitextFolded ? "none" : "";
    header.classList.toggle("folded", wikitextFolded);
    header.innerHTML = '<span class="arrow">▼</span> wikitext (click to ' +
      (wikitextFolded ? "expand" : "fold") + ")";
  });
}

fieldsEl.addEventListener("input", e => {
  const k = e.target.dataset.key;
  if (!k) return;
  values[k] = e.target.value;
  e.target.classList.toggle("filled", e.target.value.trim() !== "");
  render();
});

document.getElementById("copy-btn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(buildSource());
    statusEl.textContent = "Copied filled markdown to clipboard.";
  } catch {
    statusEl.textContent = "Copy failed — select the preview manually.";
  }
  setTimeout(() => statusEl.textContent = "", 2500);
});

document.getElementById("reset-btn").addEventListener("click", () => {
  FIELDS.forEach(f => values[f.key] = "");
  document.querySelectorAll("#fields input").forEach(i => { i.value = ""; i.classList.remove("filled"); });
  render();
  statusEl.textContent = "Reset.";
  setTimeout(() => statusEl.textContent = "", 1500);
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
});

render();
</script>
